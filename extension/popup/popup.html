<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;         --fg: #202124;    --secondary: #5f6368;
    --border: #dadce0;     --track: #f1f3f4;
    --accent: #1a73e8;     --accent-hover: #1765cc; --accent-active: #1a5bc7;
    --on-accent: #ffffff;  --disabled-bg: #e4e6e8;  --disabled-fg: #9aa0a6;
    --error: #d93025;      --warn: #b26a00;         --ok: #188038;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #292a2d;       --fg: #e8eaed;    --secondary: #9aa0a6;
      --border: #4a4c50;   --track: #35363a;
      --accent: #8ab4f8;   --accent-hover: #a6c4fa; --accent-active: #b3ccfb;
      --on-accent: #202124; --disabled-bg: #3c4043;  --disabled-fg: #80868b;
      --error: #f28b82;    --warn: #fdd663;         --ok: #81c995;
    }
  }
  * { box-sizing: border-box; }
  body {
    min-width: 320px; margin: 0; padding: 12px 14px 14px;
    background: var(--bg); color: var(--fg);
    font: 400 13px/20px Roboto, "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  header svg { color: var(--secondary); flex: 0 0 auto; }
  h1 { font-size: 14px; font-weight: 500; margin: 0; letter-spacing: .1px; }

  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 2px; cursor: pointer; border-radius: 6px; }
  label.opt:hover { background: var(--track); }
  label.opt input { margin: 3px 0 0; width: 15px; height: 15px; accent-color: var(--accent); }
  label.opt b { font-weight: 500; display: block; }
  label.opt small { display: block; color: var(--secondary); font-size: 11px; line-height: 16px; }

  #export {
    width: 100%; margin-top: 8px; height: 34px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--on-accent);
    font: 500 13px/1 Roboto, "Segoe UI", system-ui, sans-serif; letter-spacing: .25px;
    cursor: pointer; transition: background .12s, box-shadow .12s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  #export:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  #export:active:not(:disabled) { background: var(--accent-active); }
  #export:disabled { background: var(--disabled-bg); color: var(--disabled-fg); cursor: default; }
  #export:focus-visible, label.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  #progress { margin-top: 12px; }
  ul#log {
    margin: 0; padding: 6px 8px; list-style: none; max-height: 168px; overflow-y: auto;
    background: var(--track); border: 1px solid var(--border); border-radius: 8px;
    font: 400 11px/18px "Roboto Mono", ui-monospace, monospace; color: var(--secondary);
  }
  ul#log li { display: flex; gap: 7px; align-items: center; min-height: 18px; }
  ul#log li .ic { flex: 0 0 12px; height: 12px; }
  .spin { width: 12px; height: 12px; border-radius: 50%;
          border: 2px solid var(--border); border-top-color: var(--accent);
          animation: rot .8s linear infinite; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .tick { color: var(--ok); font-weight: 700; }
  ul#log li.done { color: var(--secondary); }
  ul#log li.active { color: var(--fg); }
  #status { margin-top: 8px; white-space: pre-wrap; font-size: 12px; line-height: 18px; }
  #status.error { color: var(--error); }
  #status.warn { color: var(--warn); }
  #status.ok { color: var(--ok); }
</style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/>
      <path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9.2 14.8 2.8 2.7 2.8-2.7"/>
    </svg>
    <h1>Arena Transcript Export</h1>
  </header>

  <label class="opt"><input type="checkbox" id="includeToolActivity" checked>
    <span><b>Expand &amp; include tool activity</b>
    <small>Reasoning blocks, command runs, edits — all spoilers, incl. nested.</small></span></label>
  <label class="opt"><input type="checkbox" id="timestamps">
    <span><b>Message timestamps</b>
    <small>Add the visible message time to each heading.</small></span></label>

  <button id="export">Export branch to Markdown</button>
  <section id="progress" hidden><ul id="log"></ul><div id="status"></div></section>
  <script src="popup.js"></script>
</body>
</html>
