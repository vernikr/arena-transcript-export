<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { min-width: 300px; margin: 0; padding: 14px; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
  label small { color: #59636e; display: block; }
  #export { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #1f883d; color: #fff; font-weight: 600; cursor: pointer; }
  #export:disabled { background: #8c959f; cursor: default; }
  #status { margin-top: 10px; white-space: pre-wrap; color: #59636e; }
  #status.error { color: #d1242f; }
  #status.warn  { color: #9a6700; }
</style>
</head>
<body>
  <h1>Arena Transcript Export</h1>
  <label><input type="checkbox" id="includeToolActivity" checked>
    <span>Expand &amp; include tool activity<small>Reasoning blocks, command runs, edits (all spoilers, incl. nested).</small></span></label>
  <label><input type="checkbox" id="timestamps">
    <span>Message timestamps<small>Add the visible message time to each heading.</small></span></label>
  <button id="export">Export branch to Markdown</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
